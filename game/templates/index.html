<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>修仙游戏控制台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="badge">NAS 轻量修仙 · API 控制台</p>
        <h1>修仙游戏一站式控制面板</h1>
        <p class="subtitle">
          面向 Flask API 的快速操作界面，支持注册/登录、角色创建、修炼、历练、挑战、灵宠系统。
        </p>
      </div>
      <div class="hero-card">
        <h2>连接状态</h2>
        <p id="status">未登录</p>
        <div class="pill">API: http://localhost:8000</div>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>账号</h2>
        <div class="form-grid">
          <label>
            用户名
            <input id="username" placeholder="请输入用户名" />
          </label>
          <label>
            密码
            <input id="password" type="password" placeholder="请输入密码" />
          </label>
          <button class="primary" id="register">注册</button>
          <button class="ghost" id="login">登录</button>
          <button class="ghost" id="logout">注销</button>
        </div>
      </section>

      <section class="card">
        <h2>角色</h2>
        <div class="form-grid">
          <label>
            角色名
            <input id="playerName" placeholder="如：小青" />
          </label>
          <button class="primary" id="createPlayer">创建角色</button>
          <button class="ghost" id="getPlayer">查看角色</button>
          <button class="danger" id="deletePlayer">删除角色</button>
        </div>
        <pre id="playerInfo">尚未获取角色信息。</pre>
      </section>

      <section class="card">
        <h2>修炼 & 历练</h2>
        <div class="button-row">
          <button class="primary" id="train">修炼</button>
          <button class="primary" id="explore">历练</button>
        </div>
        <pre id="progressInfo">修炼日志将在这里显示。</pre>
      </section>

      <section class="card">
        <h2>挑战</h2>
        <div class="form-grid">
          <button class="primary" id="pve">挑战妖兽 (PVE)</button>
          <label>
            对手角色 ID
            <input id="opponentId" placeholder="player_xxxx" />
          </label>
          <button class="ghost" id="pvp">玩家对战 (PVP)</button>
        </div>
        <pre id="battleInfo">挑战结果将在这里显示。</pre>
      </section>

      <section class="card">
        <h2>灵宠系统</h2>
        <div class="form-grid">
          <button class="primary" id="capturePet">捕捉灵宠</button>
          <label>
            灵宠 ID
            <input id="petId" placeholder="pet_xxxx" />
          </label>
          <button class="ghost" id="upgradePet">灵宠升级</button>
          <button class="ghost" id="getEvolveOptions">获取进化选项</button>
          <label>
            进化选项 key
            <input id="evolveChoice" placeholder="如：crit_rate" />
          </label>
          <button class="primary" id="evolvePet">提交进化</button>
        </div>
        <pre id="petInfo">灵宠信息将在这里显示。</pre>
      </section>

      <section class="card full">
        <h2>API 日志</h2>
        <div id="log"></div>
      </section>
    </main>

    <footer class="footer">修仙游戏控制台 · 可嵌入前端或群晖 NAS Docker 环境</footer>

    <script src="/static/app.js"></script>
  </body>
</html>
